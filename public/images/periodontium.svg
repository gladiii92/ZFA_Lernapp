<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%" aria-labelledby="periodontiumTitle periodontiumDesc">
  <title id="periodontiumTitle">Der Zahnhalteapparat (Parodontium)</title>
  <desc id="periodontiumDesc">Detaillierte Darstellung der 4 Komponenten des Parodontiums: Gingiva, Wurzelzement, Desmodont mit Sharpey-Fasern und Alveolarknochen im Antigravity Dark-Slate Design.</desc>
  <defs>
    <linearGradient id="periGingiva" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="periBone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="periDentin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="periCementum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <pattern id="spongeBone" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.8" fill="#64748B" opacity="0.4"/>
      <circle cx="11" cy="11" r="1.4" fill="#64748B" opacity="0.4"/>
      <path d="M 1,9 L 7,9" stroke="#475569" stroke-width="1" fill="none" opacity="0.5"/>
    </pattern>
    <style>
      .header-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #F8FAFC; }
      .header-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94A3B8; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #F8FAFC; }
      .card-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #CBD5E1; }
      .card-latin { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-style: italic; fill: #94A3B8; }
      .badge-num { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 800; fill: #FFFFFF; }
      .fiber { stroke: #38BDF8; stroke-width: 1.8; stroke-linecap: square; }
      .fiber-highlight { stroke: #0284C7; stroke-width: 2.4; stroke-linecap: square; }
      .callout-line { stroke: #38BDF8; stroke-width: 1.5; stroke-dasharray: 4,3; }
    </style>
  </defs>

  <!-- Hintergrund & Rahmen (Antigravity Dark-Slate) -->
  <rect width="100%" height="100%" fill="#0B1120" rx="12"/>
  <rect x="10" y="10" width="780" height="630" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" rx="10"/>
  
  <text x="400" y="42" text-anchor="middle" class="header-title">Das Parodontium (Zahnhalteapparat)</text>
  <text x="400" y="64" text-anchor="middle" class="header-subtitle">Die 4 funktionellen Komponenten zur federnden Verankerung des Zahnes im Kieferknochen</text>

  <!-- Linke Seite: Großer mikroskopischer Detail-Schnitt -->
  <g id="diagram-cross-section" transform="translate(30, 90)">
    <!-- Hintergrund Alveolarknochen -->
    <rect x="230" y="110" width="130" height="400" fill="url(#periBone)" stroke="#334155" stroke-width="1" rx="4"/>
    <rect x="230" y="110" width="130" height="400" fill="url(#spongeBone)" rx="4"/>
    <!-- Knochenkamm (Limbus alveolaris) -->
    <path d="M 230,110 L 250,95 L 260,110 L 260,130 L 230,130 Z" fill="#334155"/>
    <text x="240" y="85" font-family="system-ui" font-size="11px" font-weight="600" fill="#94A3B8">Knochenkamm</text>

    <!-- Gingiva (Zahnfleisch oben) mit Sulcus -->
    <path d="M 30,15 L 75,15 L 90,55 L 90,130 L 230,130 L 230,110 L 130,40 L 60,20 Z" fill="url(#periGingiva)" stroke="#BE123C" stroke-width="1.2"/>
    <line x1="90" y1="45" x2="90" y2="110" stroke="#FFE4E6" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="40" y="85" font-family="system-ui" font-size="11px" font-weight="700" fill="#FFE4E6">Sulcus (1-2mm)</text>

    <!-- Dentinmasse der Wurzel -->
    <path d="M 0,0 L 70,0 L 70,510 L 0,510 Z" fill="url(#periDentin)" stroke="#B45309" stroke-width="1"/>
    <text x="35" y="260" font-family="system-ui" font-size="14px" font-weight="700" fill="#78350F" transform="rotate(-90 35 260)">Dentin (Zahnwurzel)</text>

    <!-- Wurzelzement (Cementum) hauchdünne Schicht auf Dentin -->
    <rect x="70" y="110" width="18" height="400" fill="url(#periCementum)"/>
    <line x1="70" y1="110" x2="70" y2="510" stroke="#78350F" stroke-width="1"/>
    <line x1="88" y1="110" x2="88" y2="510" stroke="#78350F" stroke-width="1"/>

    <!-- Desmodont (Wurzelhaut) / Periodontalspalt (ca. 0.2 mm) -->
    <rect x="88" y="120" width="142" height="390" fill="#0369A1" opacity="0.2"/>
    
    <!-- Sharpey-Fasern (Kollagenfaserbündel) -->
    <g id="gingival-fibers">
      <line x1="88" y1="125" x2="150" y2="80" class="fiber"/>
      <line x1="88" y1="138" x2="170" y2="95" class="fiber"/>
      <line x1="88" y1="150" x2="190" y2="115" class="fiber"/>
    </g>
    <g id="crestal-fibers">
      <line x1="88" y1="170" x2="230" y2="135" class="fiber-highlight"/>
      <line x1="88" y1="185" x2="230" y2="150" class="fiber"/>
      <line x1="88" y1="200" x2="230" y2="165" class="fiber"/>
    </g>
    <g id="horizontal-fibers">
      <line x1="88" y1="230" x2="230" y2="230" class="fiber-highlight"/>
      <line x1="88" y1="250" x2="230" y2="250" class="fiber"/>
      <line x1="88" y1="270" x2="230" y2="270" class="fiber"/>
    </g>
    <g id="oblique-fibers">
      <line x1="88" y1="320" x2="230" y2="285" class="fiber-highlight"/>
      <line x1="88" y1="345" x2="230" y2="310" class="fiber"/>
      <line x1="88" y1="370" x2="230" y2="335" class="fiber-highlight"/>
      <line x1="88" y1="395" x2="230" y2="360" class="fiber"/>
      <line x1="88" y1="420" x2="230" y2="385" class="fiber"/>
      <line x1="88" y1="445" x2="230" y2="410" class="fiber-highlight"/>
      <line x1="88" y1="470" x2="230" y2="435" class="fiber"/>
    </g>

    <!-- Gefäße & Nerven im Periodontalspalt -->
    <path d="M 160,130 L 163,300 L 160,510" stroke="#EF4444" stroke-width="2" fill="none"/>
    <path d="M 166,130 L 168,300 L 165,510" stroke="#38BDF8" stroke-width="1.8" fill="none"/>
    <path d="M 172,130 L 173,300 L 170,510" stroke="#FBBF24" stroke-width="1.8" fill="none"/>
  </g>

  <!-- Rechte Seite: 4 Schlüsselkomponenten-Karten (Antigravity Dark-Slate) -->
  <g id="cards-container" transform="translate(430, 85)">
    <!-- 1. Gingiva -->
    <g id="hotspot-gingiva" transform="translate(0, 0)">
      <rect width="330" height="105" fill="#1E293B" stroke="#E11D48" stroke-width="1.5" rx="8"/>
      <circle cx="24" cy="26" r="14" fill="#E11D48"/>
      <text x="24" y="31" text-anchor="middle" class="badge-num">1</text>
      <text x="48" y="24" class="card-title">Zahnfleisch (Gingiva)</text>
      <text x="48" y="39" class="card-latin">Gingiva propria / Freie &amp; befestigte Gingiva</text>
      <text x="16" y="64" class="card-sub">• Dichtet das Periodontium keimdicht gegen Mundhöhle ab</text>
      <text x="16" y="82" class="card-sub">• Saumepithel bildet die biologische Schutzbarriere</text>
      <line x1="-30" y1="50" x2="-140" y2="50" class="callout-line"/>
    </g>

    <!-- 2. Wurzelzement -->
    <g id="hotspot-cementum" transform="translate(0, 125)">
      <rect width="330" height="105" fill="#1E293B" stroke="#D97706" stroke-width="1.5" rx="8"/>
      <circle cx="24" cy="26" r="14" fill="#D97706"/>
      <text x="24" y="31" text-anchor="middle" class="badge-num">2</text>
      <text x="48" y="24" class="card-title">Wurzelzement (Cementum)</text>
      <text x="48" y="39" class="card-latin">Substantia ossea / Zementoblasten</text>
      <text x="16" y="64" class="card-sub">• Überzieht die anatomische Zahnwurzel hauchdünn</text>
      <text x="16" y="82" class="card-sub">• Dient als Verankerungspunkt der Sharpey-Fasern</text>
      <line x1="-30" y1="50" x2="-320" y2="190" class="callout-line"/>
    </g>

    <!-- 3. Desmodont / Sharpey-Fasern -->
    <g id="hotspot-desmodont" transform="translate(0, 250)">
      <rect width="330" height="120" fill="#1E293B" stroke="#38BDF8" stroke-width="2" rx="8"/>
      <circle cx="24" cy="26" r="14" fill="#0284C7"/>
      <text x="24" y="31" text-anchor="middle" class="badge-num">3</text>
      <text x="48" y="24" class="card-title">Wurzelhaut (Desmodont)</text>
      <text x="48" y="39" class="card-latin">Periodontium / Sharpey-Fasern (Ligament)</text>
      <text x="16" y="64" class="card-sub">• Straffe Kollagenfasern fangen Kaudruck elastisch ab</text>
      <text x="16" y="82" class="card-sub">• Schützt den Alveolarknochen vor Kaustößen (Trauma)</text>
      <text x="16" y="100" class="card-sub">• Nervenfasern vermitteln Tastsinn (Propriozeption)</text>
      <line x1="-30" y1="55" x2="-230" y2="290" class="callout-line"/>
    </g>

    <!-- 4. Alveolarknochen -->
    <g id="hotspot-bone" transform="translate(0, 390)">
      <rect width="330" height="105" fill="#1E293B" stroke="#64748B" stroke-width="1.5" rx="8"/>
      <circle cx="24" cy="26" r="14" fill="#475569"/>
      <text x="24" y="31" text-anchor="middle" class="badge-num">4</text>
      <text x="48" y="24" class="card-title">Alveolarknochen</text>
      <text x="48" y="39" class="card-latin">Processus alveolaris / Lamina cribriformis</text>
      <text x="16" y="64" class="card-sub">• Knöchernes Zahnfach (Alveole) zur Aufnahme der Wurzel</text>
      <text x="16" y="82" class="card-sub">• Baut sich bei Zahnverlust mangels Kaudruckbelastung ab</text>
      <line x1="-30" y1="50" x2="-90" y2="390" class="callout-line"/>
    </g>
  </g>

  <!-- Merksatz unten -->
  <rect x="30" y="580" width="740" height="38" fill="#1E293B" stroke="#334155" rx="6"/>
  <text x="45" y="604" font-family="system-ui, -apple-system, sans-serif" font-size="12px" fill="#FBBF24" font-weight="700">ZFA-Prüfungswissen:</text>
  <text x="175" y="604" font-family="system-ui, -apple-system, sans-serif" font-size="12px" fill="#F1F5F9">Parodontium = Gingiva + Wurzelzement + Desmodont (Wurzelhaut mit Sharpey-Fasern) + Alveolarknochen.</text>
</svg>